syntax = "proto3";

package strategy.v1;
option go_package = "github.com/hushine-tech/strategy-service/gen/strategyv1;strategyv1";

service StrategyService {
  // RunStrategy starts strategy execution and returns immediately with a session_id.
  // Data delivery is selected from the Portfolio environment:
  //   environment=0 (backtest) -> paged historical reads through the platform proxy
  //   environment=1 (demo)     -> RuntimeChannel live K-line and order-update frames
  //   environment=2 (live)     -> RuntimeChannel, rollout-guarded and fail-closed
  rpc RunStrategy(RunStrategyRequest) returns (RunStrategyResponse);

  // PreviewRunStrategy runs the same profile-specific preflight as RunStrategy
  // but does NOT create a session, persist state, or start a background worker.
  // Gateway / UI surfaces call this to learn what will happen when the user
  // clicks "run": profile classification, supported-ness, and any failing
  // declared inputs. The evaluator is guaranteed to be byte-for-byte the same
  // code path RunStrategy uses, so the UI can never drift from startup.
  rpc PreviewRunStrategy(PreviewRunStrategyRequest) returns (PreviewRunStrategyResponse);

  // GetStrategyStatus returns the current execution status of a strategy session.
  rpc GetStrategyStatus(GetStrategyStatusRequest) returns (GetStrategyStatusResponse);

  // StopStrategy stops a running strategy session.
  rpc StopStrategy(StopStrategyRequest) returns (StopStrategyResponse);

}

message RunStrategyRequest {
  int64  portfolio_id    = 1;
  string strategy_path = 2;  // Python import path (Phase 2 后由 active strategy 替代)
  reserved 3, 4;
  reserved "symbol", "symbol_type";
  string interval      = 5;  // "1m", "5m", "15m", "1h", "4h", "1d"
  // Backtest only (used when portfolio environment=0; ignored for demo/live)
  int64  start_time_ms = 6;
  int64  end_time_ms   = 7;
  int64  user_id       = 100;
  string runtime_id    = 101;
  // Ratio, not percent. 0 means "not provided"; runtime falls back to
  // strategy declaration or platform default.
  double max_loss_close_pct = 102;
  // Session-level leverage used by runtime/order risk checks.
  // 0 means "not provided"; runtime falls back to platform default 1x.
  double leverage = 103;
}

message RunStrategyResponse {
  string session_id = 1;
}

message GetStrategyStatusRequest {
  string session_id = 1;
  int64  user_id    = 100;
  string runtime_id = 101;
}

message GetStrategyStatusResponse {
  string status         = 1;  // "running" / "stopping" / "finished" / "failed" / "stop_failed" / "stopped"
  int32  bars_processed = 2;
  string error          = 3;
}

enum StopAction {
  STOP_ACTION_UNSPECIFIED = 0;
  STOP_ACTION_CANCEL = 1;
  STOP_ACTION_STOP_ONLY = 2;
  STOP_ACTION_STOP_AND_CLOSE_POSITIONS = 3;
  STOP_ACTION_FINISH = 4;
}

message StopStrategyRequest {
  string session_id = 1;
  StopAction stop_action = 3;
  int64 user_id = 100;
  string runtime_id = 101;
}

message StopStrategyResponse {
  bool stopped = 1;
}

// ── PreviewRunStrategy ────────────────────────────────────────────────────
//
// Dry-run preflight: resolves the strategy's declared input universe, classifies
// the runtime source profile, and reports declared-input-level readiness without
// creating a session. Used by gateway to show "will this start?" feedback using
// the same evaluator RunStrategy itself runs.

message PreviewRunStrategyRequest {
  int64  portfolio_id    = 1;
  string strategy_path = 2;  // same semantics as RunStrategy (may be empty)
  int64  start_time_ms = 6;  // backtest-only; ignored for demo/live
  int64  end_time_ms   = 7;
  int64  user_id       = 100;
  string runtime_id    = 101;
  // Ratio, not percent. 0 means "not provided"; runtime falls back to
  // strategy declaration or platform default.
  double max_loss_close_pct = 102;
  // Session-level leverage preview. 0 means "not provided"; runtime falls
  // back to platform default 1x.
  double leverage = 103;
}

message PreflightInputKey {
  string market   = 1;
  string symbol   = 2;
  string interval = 3;
}

message PreflightFailureProto {
  // Typed reason category:
  //   "profile"          — runtime source profile is not wired up
  //   "invalid_request"  — e.g. backtest missing a valid time range
  //   "historical_data"  — no usable historical rows in requested range
  //   "stream"           — demo/live stream missing / not running / stale
  //   "declaration"      — reserved; declaration errors surface via RPC status
  string kind      = 1;
  // Human-readable reason, safe to display in UI.
  string reason    = 2;
  // Populated when the failure is attributable to a specific declared input;
  // absent (empty message) for profile-level failures.
  PreflightInputKey input_key = 3;
}

message PreviewRunStrategyResponse {
  // Conceptual profile: "backtest" / "demo" / "live" / "unknown".
  string profile   = 1;
  // Whether the resolved profile has a wired runtime today.
  bool   supported = 2;
  // True only when (a) profile is supported AND (b) every declared input
  // passed the profile-specific preflight.
  bool   ok        = 3;
  repeated PreflightFailureProto failures         = 4;
  // Populated on success for demo/live profiles — informs the UI what
  // stream bindings will be subscribed to.
  repeated LiveStreamBinding     required_streams = 5;
  // Populated after strategy INPUTS are parsed so gateway/UI can evaluate
  // backtest historical coverage without guessing the strategy's input universe.
  repeated LiveStreamBinding     declared_inputs  = 6;
  // Strategy ORDER_TARGETS exactly as declared by user strategy code.
  repeated StrategyOrderTargetBinding declared_order_targets = 7;
  // Union of INPUTS and ORDER_TARGETS routes required by the portfolio/session.
  repeated StrategyRouteBinding required_routes = 8;
  // Effective risk settings after strategy declaration and request defaults
  // have been resolved.
  RiskControls risk_controls = 9;
}

message RiskControls {
  double max_loss_close_pct = 1;
  string max_loss_close_source = 2; // strategy / request_default / platform_default
  double leverage = 3;
  string leverage_source = 4; // request_default / platform_default
}

message StrategyOrderTargetBinding {
  string exchange = 1;
  string market = 2;
  string symbol = 3;
}

message StrategyRouteBinding {
  string exchange = 1;
  string market = 2;
}

message LiveStreamBinding {
  int64 stream_id = 1;
  string exchange = 2;
  string market = 3;
  string kind = 4;
  string symbol = 5;
  string interval = 6;
}
