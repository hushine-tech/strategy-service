syntax = "proto3";

package strategy.v1;
option go_package = "github.com/hushine-tech/strategy-service/gen/strategyv1;strategyv1";

service StrategyService {
  // RunStrategy starts strategy execution and returns immediately with a session_id.
  // Data delivery is selected from the Portfolio environment:
  //   environment=0 (backtest) -> paged historical reads through the platform proxy
  //   environment=1 (demo)     -> RuntimeChannel live K-line and order-update frames
  //   environment=2 (live)     -> RuntimeChannel, rollout-guarded and fail-closed
  rpc RunStrategy(RunStrategyRequest) returns (RunStrategyResponse);

  // PrepareRunStrategyStart executes a one-shot, read-only preparation worker.
  // It resolves an immutable launch manifest but does not create a Session or
  // execute user strategy callbacks.
  rpc PrepareRunStrategyStart(PrepareRunStrategyStartRequest) returns (PreparedRunStrategyStart);

  // PreviewRunStrategy runs the same profile-specific preflight as RunStrategy
  // but does NOT create a session, persist state, or start a background worker.
  // Gateway / UI surfaces call this to learn what will happen when the user
  // clicks "run": profile classification, supported-ness, and any failing
  // declared inputs. The evaluator is guaranteed to be byte-for-byte the same
  // code path RunStrategy uses, so the UI can never drift from startup.
  rpc PreviewRunStrategy(PreviewRunStrategyRequest) returns (PreviewRunStrategyResponse);

  // ValidateStrategySource checks source against the exact dependency profile
  // used by RunStrategy without creating or mutating a session.
  rpc ValidateStrategySource(ValidateStrategySourceRequest) returns (ValidateStrategySourceResponse);

  // GetStrategyStatus returns the current execution status of a strategy session.
  rpc GetStrategyStatus(GetStrategyStatusRequest) returns (GetStrategyStatusResponse);

  // StopStrategy stops a running strategy session.
  rpc StopStrategy(StopStrategyRequest) returns (StopStrategyResponse);

}

message RuntimeDependencyProfile {
  uint32 schema_version = 1;
  string profile_name = 2;
  string profile_version = 3;
  string contract_sha256 = 4;
  string hosted_python = 5;
  repeated string public_import_roots = 6;
  string strategy_service_commit = 7;
  string strategy_library_commit = 8;
  string image_build_id = 9;
}

message RuntimeDependencyError {
  string code = 1;
  string module = 2;
  string runtime_profile = 3;
  string runtime_profile_version = 4;
  string image_build_id = 5;
  string message = 6;
}

message StrategyValidationIssueProto {
  string code = 1;
  string message = 2;
  string module = 3;
  int32 line = 4;
  string symbol = 5;
}

message ValidateStrategySourceRequest {
  string source = 1;
  int64 user_id = 100;
  string runtime_id = 101;
  // Opt-in because resolving declarations executes the strategy module and
  // constructs MyStrategy inside the selected runtime's one-shot worker.
  bool include_declarations = 102;
}

message StrategyInputDeclaration {
  string stream_id = 1;
  string exchange = 2;
  string market = 3;
  string kind = 4;
  string symbol = 5;
  string interval = 6;
}

message ValidateStrategySourceResponse {
  bool ok = 1;
  repeated StrategyValidationIssueProto issues = 2;
  RuntimeDependencyProfile runtime_profile = 3;
  repeated StrategyInputDeclaration declared_inputs = 4;
  repeated StrategyOrderTargetBinding declared_order_targets = 5;
}

message RunStrategyRequest {
  int64  portfolio_id    = 1;
  string strategy_path = 2;  // Python import path (Phase 2 后由 active strategy 替代)
  reserved 3, 4;
  reserved "symbol", "symbol_type";
  string interval      = 5;  // "1m", "5m", "15m", "1h", "4h", "1d"
  // Backtest only (used when portfolio environment=0; ignored for demo/live)
  int64  start_time_ms = 6;
  int64  end_time_ms   = 7;
  int64  user_id       = 100;
  string runtime_id    = 101;
  // Ratio, not percent. 0 means "not provided"; runtime falls back to
  // strategy declaration or platform default.
  double max_loss_close_pct = 102;
  // Deprecated session-wide leverage retained for wire compatibility. Target
  // leverage is strategy-owned and this value is ignored.
  double leverage = 103 [deprecated = true];
}

message RunStrategyResponse {
  string session_id = 1;
  bool ok = 2;
  repeated PreflightFailureProto failures = 3;
  repeated StrategyLeverageTargetResult target_results = 4;
  string code = 5;
  bool rollback_failed = 6;
}

message GetStrategyStatusRequest {
  string session_id = 1;
  int64  user_id    = 100;
  string runtime_id = 101;
}

message GetStrategyStatusResponse {
  string status         = 1;  // "running" / "stopping" / "finished" / "failed" / "stop_failed" / "stopped"
  int32  bars_processed = 2;
  string error          = 3;
}

enum StopAction {
  STOP_ACTION_UNSPECIFIED = 0;
  STOP_ACTION_CANCEL = 1;
  STOP_ACTION_STOP_ONLY = 2;
  STOP_ACTION_STOP_AND_CLOSE_POSITIONS = 3;
  STOP_ACTION_FINISH = 4;
}

message StopStrategyRequest {
  string session_id = 1;
  StopAction stop_action = 3;
  string operation_id = 4;
  int64 user_id = 100;
  string runtime_id = 101;
}

message StopStrategyResponse {
  bool stopped = 1;
  string status = 2;
  string code = 3;
  repeated StopTargetResult target_results = 4;
  string reconciliation_run_id = 5;
  string operation_id = 6;
}

message StopTargetResult {
  int32 exchange = 1;
  int32 market = 2;
  string symbol = 3;
  string status = 4;
  string code = 5;
  string message = 6;
}

// ── PreviewRunStrategy ────────────────────────────────────────────────────
//
// Dry-run preflight: resolves the strategy's declared input universe, classifies
// the runtime source profile, and reports declared-input-level readiness without
// creating a session. Used by gateway to show "will this start?" feedback using
// the same evaluator RunStrategy itself runs.

message PreviewRunStrategyRequest {
  int64  portfolio_id    = 1;
  string strategy_path = 2;  // same semantics as RunStrategy (may be empty)
  int64  start_time_ms = 6;  // backtest-only; ignored for demo/live
  int64  end_time_ms   = 7;
  int64  user_id       = 100;
  string runtime_id    = 101;
  // Ratio, not percent. 0 means "not provided"; runtime falls back to
  // strategy declaration or platform default.
  double max_loss_close_pct = 102;
  // Deprecated session-wide preview input retained for wire compatibility.
  // Target leverage is strategy-owned and this value is ignored.
  double leverage = 103 [deprecated = true];
}

message PreflightInputKey {
  string market   = 1;
  string symbol   = 2;
  string interval = 3;
}

message PreflightFailureProto {
  // Typed reason category:
  //   "profile"          — runtime source profile is not wired up
  //   "invalid_request"  — e.g. backtest missing a valid time range
  //   "historical_data"  — no usable historical rows in requested range
  //   "stream"           — demo/live stream missing / not running / stale
  //   "declaration"      — reserved; declaration errors surface via RPC status
  string kind      = 1;
  // Human-readable reason, safe to display in UI.
  string reason    = 2;
  // Populated when the failure is attributable to a specific declared input;
  // absent (empty message) for profile-level failures.
  PreflightInputKey input_key = 3;
  string code = 4;
  int32 exchange = 5;
  int32 market = 6;
  string symbol = 7;
  int64 venue_id = 8;
  string filter_type = 9;
  int32 environment = 10;
  bool retryable = 11;
  string source = 12;
}

message PreviewRunStrategyResponse {
  // Conceptual profile: "backtest" / "demo" / "live" / "unknown".
  string profile   = 1;
  // Whether the resolved profile has a wired runtime today.
  bool   supported = 2;
  // True only when (a) profile is supported AND (b) every declared input
  // passed the profile-specific preflight.
  bool   ok        = 3;
  repeated PreflightFailureProto failures         = 4;
  // Populated on success for demo/live profiles — informs the UI what
  // stream bindings will be subscribed to.
  repeated LiveStreamBinding     required_streams = 5;
  // Populated after strategy INPUTS are parsed so gateway/UI can evaluate
  // backtest historical coverage without guessing the strategy's input universe.
  repeated LiveStreamBinding     declared_inputs  = 6;
  // Strategy ORDER_TARGETS exactly as declared by user strategy code.
  repeated StrategyOrderTargetBinding declared_order_targets = 7;
  // Union of INPUTS and ORDER_TARGETS routes required by the portfolio/session.
  repeated StrategyRouteBinding required_routes = 8;
  // Effective risk settings after strategy declaration and request defaults
  // have been resolved.
  RiskControls risk_controls = 9;
}

message RiskControls {
  double max_loss_close_pct = 1;
  string max_loss_close_source = 2; // strategy / request_default / platform_default
  // Deprecated session-wide compatibility fields. New code consumes the
  // effective/source facts on each StrategyOrderTargetBinding.
  double leverage = 3 [deprecated = true];
  string leverage_source = 4 [deprecated = true];
}

message StrategyOrderTargetBinding {
  string exchange = 1;
  string market = 2;
  string symbol = 3;
  uint32 effective_leverage = 4;
  // order_target / strategy_default / platform_default.
  string leverage_source = 5;
  // Read-only preview value; absent when not applicable or unavailable.
  optional uint32 current_leverage = 6;
  bool change_required = 7;
  int64 venue_id = 8;
  // Preview status: unchanged, change_required, read_failed, unsupported,
  // not_applicable, or unknown.
  string leverage_status = 9;
}

message StrategyRouteBinding {
  string exchange = 1;
  string market = 2;
}

message LiveStreamBinding {
  int64 stream_id = 1;
  string exchange = 2;
  string market = 3;
  string kind = 4;
  string symbol = 5;
  string interval = 6;
}

// ── Strategy-owned Futures leverage launch contract ───────────────────────

message PrepareRunStrategyStartRequest {
  RunStrategyRequest run_request = 1;
  string session_id = 2;
  string launch_operation_id = 3;
}

// Canonical pending Session metadata. The runtime-agent can map this directly
// to portfolio.v1.SaveSessionRequest without reloading or parsing Python.
message StrategySessionMetadata {
  string session_id = 1;
  int64 portfolio_id = 2;
  int64 strategy_id = 3;
  int32 environment = 4;
  string interval = 5;
  int64 start_time_ms = 6;
  int64 end_time_ms = 7;
  int64 user_id = 8;
  string runtime_id = 9;
  string runtime_source = 10;
  string runtime_name = 11;
  string session_type = 12;
  string runtime_version = 13;
  string session_name = 14;
  string initial_status = 15;
}

message StrategyRequiredSymbolBinding {
  string exchange = 1;
  string market = 2;
  string symbol = 3;
  bool order_target = 4;
  repeated string required_order_types = 5;
  uint32 effective_leverage = 6;
  string leverage_source = 7;
}

// Complete immutable output of one-shot preparation. It contains every fact
// needed to construct portfolio.v1.CommitStrategySessionStartRequest without
// parsing strategy source or recomputing target leverage.
message PreparedRunStrategyStart {
  bool ok = 1;
  StrategySessionMetadata session = 2;
  string launch_operation_id = 3;
  string strategy_source_sha256 = 4;
  repeated StrategyInputDeclaration declared_inputs = 5;
  repeated StrategyOrderTargetBinding declared_order_targets = 6;
  repeated StrategyRouteBinding required_routes = 7;
  repeated StrategyRequiredSymbolBinding required_symbols = 8;
  PreviewRunStrategyResponse preflight = 9;
  RiskControls risk_controls = 10;
  repeated PreflightFailureProto failures = 11;
}

// Confirmed target fact safe for a final strategy worker. It deliberately has
// no credential material, fingerprint, Venue secret, or platform endpoint.
message StrategySessionTargetLeverageFact {
  int64 venue_id = 1;
  string exchange = 2;
  int32 environment = 3;
  string market = 4;
  string symbol = 5;
  uint32 effective_leverage = 6;
  string leverage_source = 7;
  optional uint32 previous_leverage = 8;
  uint32 confirmed_leverage = 9;
  int64 confirmed_at_unix_ms = 10;
}

message StrategySessionBootstrap {
  string session_id = 1;
  string launch_operation_id = 2;
  string strategy_source_sha256 = 3;
  repeated StrategySessionTargetLeverageFact confirmed_target_facts = 4;
}

// Structured terminal result for a leverage target. status is one of:
// unchanged, confirmed, set_failed, confirm_failed, rolled_back,
// rollback_failed, unknown.
message StrategyLeverageTargetResult {
  int64 venue_id = 1;
  int32 exchange = 2;
  int32 market = 3;
  string symbol = 4;
  uint32 effective_leverage = 5;
  string leverage_source = 6;
  optional uint32 previous_leverage = 7;
  optional uint32 current_leverage = 8;
  optional uint32 confirmed_leverage = 9;
  bool change_required = 10;
  string status = 11;
  string error_code = 12;
  string error_message = 13;
  bool retryable = 14;
}
