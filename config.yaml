# RuntimeChannel executor config.
#
# Do not put database, Kafka, portfolio/core-service, or order-service endpoints
# here. Hosted, self-hosted, and bare runtimes reach platform services through
# RuntimeChannel proxy calls.

dependencies:
  # Dedicated RuntimeChannel listener on control-panel-service.
  # Override with RUNTIME_CHANNEL_GRPC_ADDR or --runtime-channel-addr.
  runtime_channel_grpc: "127.0.0.1:50055"

runtime:
  # Empty uses /etc/hushine/runtime.cred for self-hosted runtimes.
  # Bare debug uses `hushine-runtime start --user-id ...` instead.
  credential_path: ""
  source: ""
  runtime_id: ""
  name: ""
  capabilities: ["strategy", "spot", "futures"]
  resource_profile: "small"
  version: "0.1.0"
  heartbeat_interval_seconds: 10

runtime_channel_tls:
  enabled: false
  root_cert_file: ""
  server_name: ""

market_data:
  preflight_enabled: true
  lease_management_enabled: true
  lease_heartbeat_seconds: 30
  lease_ttl_seconds: 90
  freshness_grace_seconds: 30

notification:
  enabled: true
  timeout_seconds: 2

log:
  tracing:
    enabled: false
    endpoint: ""
    service_name: "strategy-service"
